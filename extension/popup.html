<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body{
    width:280px; font-family:'Segoe UI',sans-serif; background:#0a0e13; color:#e7edf3;
    padding:16px; margin:0;
  }
  h1{font-size:15px; margin:0 0 4px;}
  p{font-size:11px; color:#7c8794; margin:0 0 14px; line-height:1.5;}
  label{display:block; font-size:11px; color:#7c8794; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px;}
  input{
    width:100%; box-sizing:border-box; background:#161c25; border:1px solid #1f2733; color:#e7edf3;
    padding:8px 10px; border-radius:5px; font-size:12px; margin-bottom:12px;
  }
  button{
    width:100%; padding:9px; border:none; border-radius:5px; background:#39d98a;
    color:#04150c; font-weight:700; font-size:13px; cursor:pointer;
  }
  #status{font-size:11px; margin-top:10px; color:#39d98a; display:none;}
</style>
</head>
<body>
  <h1>Aqtify — PQ-SMAP</h1>
  <p>Right-click any image on a page and choose "Verify with Aqtify". Set your API key below first.</p>

  <label>API base URL</label>
  <input type="text" id="apiBase" placeholder="http://127.0.0.1:8000">

  <label>API key</label>
  <input type="text" id="apiKey" placeholder="aqt_...">

  <button id="save">Save</button>
  <div id="status">Saved.</div>

  <script src="popup.js"></script>
</body>
</html>
